name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath -o bin/mosaic ./cmd/mosaic
        if: runner.os != 'Windows'
      - name: Build from PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build.ps1
      - name: PowerShell 7 smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke_powershell.ps1
      - name: Windows PowerShell 5.1 smoke
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/smoke_powershell.ps1
      - run: go run ./cmd/mosaic --demo --snapshot
      - name: Terminal smoke test
        if: runner.os != 'Windows'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
          .venv/bin/python scripts/smoke_pty.py
          .venv/bin/python scripts/smoke_iterm.py
          .venv/bin/python scripts/smoke_compatibility.py
          .venv/bin/python scripts/smoke_layout.py
          .venv/bin/python scripts/smoke_panels.py
          .venv/bin/python scripts/smoke_collectors.py
          .venv/bin/python scripts/test_terminal_render.py
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Native Windows console smoke
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 3
        run: |
          python -m pip install -r requirements-dev.txt
          python scripts/smoke_conpty.py
          python scripts/smoke_collectors.py
          python scripts/test_terminal_render.py
  builds:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - { os: linux, arch: amd64, suffix: '' }
          - { os: linux, arch: arm64, suffix: '' }
          - { os: darwin, arch: amd64, suffix: '' }
          - { os: darwin, arch: arm64, suffix: '' }
          - { os: windows, arch: amd64, suffix: '.exe' }
          - { os: windows, arch: arm64, suffix: '.exe' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o dist/mosaic-${{ matrix.target.os }}-${{ matrix.target.arch }}${{ matrix.target.suffix }} ./cmd/mosaic
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
          CGO_ENABLED: '0'
      - uses: actions/upload-artifact@v4
        with:
          name: mosaic-${{ matrix.target.os }}-${{ matrix.target.arch }}
          path: dist/*
